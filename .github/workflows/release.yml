name: Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Single source of truth for the release version, shared by the android and ios jobs so
  # they can never disagree — both derive their platform-native version fields from the same
  # tag here instead of each parsing GITHUB_REF_NAME independently.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      version_code: ${{ steps.compute.outputs.version_code }}
    steps:
      - name: Compute version from tag
        id: compute
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS='.' read -r major minor patch <<< "$VERSION"
          VERSION_CODE=$(( major * 10000 + minor * 100 + patch ))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      # The google-services Gradle plugin fails the build outright if this file is missing —
      # decode it from a repo secret the same way the signing key/cert are handled below.
      # Set GOOGLE_SERVICES_JSON to the base64 of android/app/google-services.json
      # (from the Firebase console: Project settings > General > your Android app).
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json

      - name: Install JetBrains JDK 21
        run: |
          url=$(curl -s "https://api.foojay.io/disco/v3.0/packages?jdk_version=21&distribution=jetbrains&architecture=x64&operating_system=linux&package_type=jdk&release_status=ga&latest=per_distro" | \
            jq -r '.result[0].links.pkg_download_redirect // empty')
          [ -n "$url" ] || { echo "JBR 21 not found"; exit 1; }
          curl -sL "$url" -o /tmp/jbr.tar.gz
          mkdir -p "$HOME/.jbr"
          tar -xzf /tmp/jbr.tar.gz -C "$HOME/.jbr" --strip-components=1
          echo "JAVA_HOME=$HOME/.jbr" >> "$GITHUB_ENV"
          echo "$HOME/.jbr/bin" >> "$GITHUB_PATH"

      # Decoded straight into app/ — build.gradle.kts's signingConfigs.release resolves
      # androidReleaseStoreFile relative to the :app module dir, not the shell's cwd.
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > android/app/release.keystore.jks

      # Gradle signs the APK itself as part of assembleRelease (see signingConfigs.release in
      # app/build.gradle.kts) — no separate apksigner/openssl step needed.
      - name: Build release APK
        working-directory: android
        run: |
          gradle assembleRelease \
            -PversionName="${{ needs.version.outputs.version }}" \
            -PversionCode="${{ needs.version.outputs.version_code }}" \
            -PandroidReleaseStoreFile="release.keystore.jks" \
            -PandroidReleaseStorePassword="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -PandroidReleaseKeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -PandroidReleaseKeyPassword="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: android/app/build/outputs/apk/release/*.apk

  # Build verification only — no signing/App Store Connect upload yet, since
  # that needs Apple Developer Program secrets (a distribution certificate,
  # provisioning profile, and an App Store Connect API key) that aren't
  # configured in this repo. Once they are, extend this job with
  # `xcodebuild archive` + `-exportArchive` + `xcrun altool`/App Store
  # Connect API upload, mirroring the android job's sign-then-upload shape.
  # Runs independently of the android job/release — a red iOS build here
  # doesn't block an Android release going out.
  #
  # Disabled (if: false): the project's pbxproj is saved by Xcode 27
  # (objectVersion 110, LastUpgradeCheck 2700) — a beta not yet on any
  # GitHub-hosted runner (macos-15's newest is Xcode 26.3). Every run fails
  # at "resolve package dependencies" with "future Xcode project file
  # format", and continue-on-error still surfaced a run on every release tag.
  # Re-enable (drop the `if:`) once Xcode 27 is available on hosted runners.
  ios:
    needs: version
    runs-on: macos-15
    if: false
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          # The macos-15 runner ships several Xcode versions, but /Applications/Xcode.app
          # (the "default") lags behind — currently 16.4, which can't even parse a project
          # saved by the Xcode 26 toolchain this iOS 26.0-targeting project needs. Pick the
          # highest-versioned Xcode_*.app actually installed instead of trusting the default.
          XCODE_APP=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then XCODE_APP="/Applications/Xcode.app"; fi
          echo "Selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Resolve Swift Package dependencies
        working-directory: ios
        run: xcodebuild -resolvePackageDependencies -project Scascan.xcodeproj -scheme Scascan

      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild build \
            -project Scascan.xcodeproj \
            -scheme Scascan \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${{ needs.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ needs.version.outputs.version_code }}"

  release:
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            ## Installation

            **Android** — Install the APK directly or add this repo to [Obtainium](https://github.com/ImranR98/Obtainium) for automatic updates.

            **iOS** — Not yet distributed via TestFlight/App Store; build from source in Xcode (`ios/Scascan.xcodeproj`, iOS 26+).
